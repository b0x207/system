monitor = ,preferred,auto,auto
monitor = eDP-1,preferred,auto,1
monitor = HDMI-A-1,preferred,auto,1
# monitor = eDP-1,preferred,auto,1.25

source = ~/.config/hypr/catppuccin-theme/themes/mocha.conf

# exec-once = hyprpm reload -n
# exec-once = wl-paste --watch cliphist store
# exec-once = /usr/bin/lxpolkit
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = awww-daemon
exec-once = quickshell
exec-once = python ~/.config/hypr/monitor_moves.py
#exec-once = /usr/libexec/xdg-desktop-portal-hyprland
exec-once = systemctl --user start hyprpolkitagent
#exec-once = sleep 5; awww img ~/.config/wallpaper/walls-catppuccin-mocha/bluehour.jpg
exec-once = sleep 5; awww img ~/.config/wallpaper/earth-behind-moon.jpg

# TODO: autostart
# exec-once = dex -a

exec-once = blueman-applet
exec-once = nm-applet

#exec-once = hyprctl setcursor catppuccin-mocha-dark-cursors 18
exec-once = hyprctl setcursor breeze_cursors 24
# exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
# exec-once = gsettings set org.gnome.desktop.interface gtk-theme catppuccin-mocha-blue-standard+default
#exec-once = gsettings set org.gnome.desktop.interface cursor-theme catppuccin-mocha-dark-cursors
# exec-once = gsettings set org.gnome.desktop.interface cursor-theme breeze_cursors
# exec-once = gsettings set org.gnome.desktop.interface font-name 'Fira Code Nerd Font'

$terminal = ghostty --working-directory=home
$fileManager = dolphin
# $menu = tofi-drun | xargs hyprctl dispatch exec --
$menu = rofi -show drun
$browser = firefox
$calculator = rofi -show calc -modi calc -no-show-match -no-sort
$bluetooth = blueman-manager

# env = HYPRCURSOR_THEME,catppuccin-mocha-dark-cursors
env = HYPRCURSOR_THEME,breeze_cursors
env = HYPRCURSOR_SIZE,24
env = XCURSOR_SIZE,24
# env = XCURSOR_THEME,catppuccin-mocha-dark
# env = XCURSOR_THEME,breeze_cursors
env = SDL_VIDEODRIVER,wayland
env = QT_QPA_PLATFORM,wayland;xcb
# env = QT_QPA_PLATFORMTHEME,qt6ct
# env = QT_STYLE_OVERRIDE=kvantum
#env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
#env = GBM_BACKEND,nvidia-drm
#env = __GLX_VENDOR_LIBRARY_NAME,nvidia
#env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = GDK_BACKEND=wayland

# Assign most workspaces to an external monitor
workspace = 1, monitor:HDMI-A-1
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:HDMI-A-1
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1

debug {
    disable_logs = true
}

general {
    gaps_in = 2
    gaps_out = 0
    border_size = 1
    col.active_border = $sky
    col.inactive_border = rgba($blueAlpha55)
    layout = dwindle
    # layout = hy3
    resize_on_border = true
    allow_tearing = true
}

decoration {
    rounding = 0
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

animations {
    animation = windows, 1, 1, default
    animation = windowsIn, 1, 7, default, popin 80%
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 0, 6, default, slide
}

input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = false
        drag_lock = true
    }
}

group {
    col.border_active = $sky
    col.border_inactive = rgba($blueAlpha55)

    groupbar {
        render_titles = false
        indicator_height = 10
        text_color = $text
        # text_offset = -17
        # font_size = 12
        col.active = rgba($surface1Alphad0)
        col.inactive = rgba($surface0Alphad0)
    }
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

gestures {
    workspace_swipe_touch = false
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

ecosystem {
    no_update_news = true
}

cursor {
    default_monitor = HDMI-A-1
    no_hardware_cursors = true
}

plugins {
    # hyprexpo {
    #     columns = 4
    #     gap_size = 5
    #     bg_col = rgb(111111)
    #     workspace_method = first first # [center/first] [workspace] e.g. first 1 or center m+1
    #
    #     enable_gesture = true # laptop touchpad, 4 fingers
    #     gesture_distance = 300 # how far is the "max"
    #     gesture_positive = true # positive = swipe down. Negative = swipe up.
    # }

    # hy3 {
    # }

    # virtual-desktops {
    #     rememberlayout = size
    # }
}

device {
    name = logitech-usb-ps/2-optical-mouse
    sensitivity = 1
}

$mainMod = SUPER
$lessMod = SUPER_SHIFT
$altMod = SUPER_ALT

bind = $mainMod, Return, exec, $terminal
bind = $lessMod, Q, killactive,
bind = $lessMod, E, exec, hyprshutdown -t "Exiting hyprland..."
#bind = $mainMod, E, exec, $fileManager
bind = $lessMod, Space, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, P, exec, $browser
# bind = $mainMod, B, exec, $bluetooth
bind = $mainMod, T, layoutmsg, togglesplit
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, C, exec, $calculator

# Move focus with mainMod + vim keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move windows with mainMod + Shift + vim keys
bind = $mainMod Shift, h, movewindow, l
bind = $mainMod shift, l, movewindow, r
bind = $mainMod shift, k, movewindow, u
bind = $mainMod shift, j, movewindow, d

# Resize windows with mainMod + Alt + vim keys
bind = $mainMod, r, submap, resize
submap = resize
binde = , l, resizeactive, 10 0
binde = , h, resizeactive, -10 0
binde = , j, resizeactive, 0 10
binde = , k, resizeactive, 0 -10

bind = $mainMod, r, submap, reset
submap = reset

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, W, exec, sh ~/.config/hypr/arbitrary_workspace.sh
bind = $lessMod, W, exec, sh ~/.config/hypr/move_to_arbitrary_workspace.sh

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# TODO: fixup
bind = $mainMod, V, exec, cliphist list | tofi | cliphist decode | wl-copy

bind = $mainMod, E, exec, $fileManager

# Groups
bind = $mainMod, G, togglegroup
bind = $mainMod, right, changegroupactive, f
bind = $mainMod, left, changegroupactive, b

# Screenshot
bindl = $mainMod, S, exec, hyprquickframe
bindl = $mainMod Shift, S, exec, env HYPRQUICKFRAME_EDITOR=1 hyprquickframe

# Lock Screen
bind = $mainMod, Escape, exec, hyprlock --grace 1

# Volume Control
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = $mainMod, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
bind = $mainMod, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
# bind = , XF86AudioRaiseVolume, exec, pamixer -i 1
# bind = , XF86AudioLowerVolume, exec, pamixer -d 1
# bind = $mainMod, XF86AudioRaiseVolume, exec, pamixer -i 5
# bind = $mainMod, XF86AudioLowerVolume, exec, pamixer -d 5
# bind = Shift, XF86AudioRaiseVolume, exec, pamixer -i 2
# bind = Shift, XF86AudioLowerVolume, exec, pamixer -d 2

# Hyprexpo
#bind = SUPER, grave, hyprexpo:expo, toggle

# Window rules
# windowrule = float,^(org\.freedesktop\.Xwayland)$
#windowrulev2 = float,title:^(pygame.window)$
# windowrule = workspace special:xwaylandvideobridge silent,initialclass:xwaylandvideobridge
# windowrulev2 = float,title:^Copying — Dolphin$
windowrule {
    name = dolphin-transfer
    match:class = org.kde.dolphin
    # match:initial_title = Copying — Dolphin
    float = yes
    center = yes
    size = 700 145
}
windowrule {
    name = dolphin-normal
    match:initial_class = org.kde.dolphin
    match:initial_title = ^\/.+ — Dolphin$
    float = no
}

# SwayNC
bind = $mainMod, N, exec, swaync-client --toggle-panel --skip-wait

# Screen Brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl s 10%+
bind = , XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Passwork manager
bind = $lessMod, B, exec, bitwarden-desktop

# Moving the current workspace to a given monitor
bind = $lessMod, Prior, movecurrentworkspacetomonitor, HDMI-A-1
bind = $lessMod, Next, movecurrentworkspacetomonitor, eDP-1
